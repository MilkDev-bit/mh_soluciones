server {
    listen 80;
    server_name localhost;

    # Ruta a los archivos estáticos de tu aplicación de React
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # --- CORRECCIÓN CLAVE ---
    # Esta línea es esencial para que las rutas de React (como /login) funcionen.
    # Le dice a NGINX que si no encuentra un archivo o directorio, sirva el index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirección de las peticiones a la API hacia el backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirección de los archivos de medios (imágenes) hacia el backend
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Silenciar errores para archivos que el navegador pide a veces
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}